name: Android build (signed release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble + bundle signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK Platform 36 and Build Tools 36.0.0
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      # A fixed Gradle version is provisioned here, so a committed
      # gradle-wrapper.jar is not required for CI to work.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. A release cannot be signed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.p12"
          if [ ! -s "$RUNNER_TEMP/signing/release.p12" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.p12" >> "$GITHUB_ENV"

      # local.properties is never committed, so without these the release would build
      # with empty BuildConfig fields: no attribution, no offer URL, always White, no push -
      # and nothing would say so until the artifact was already on Play.
      - name: Check the integration secrets are present
        env:
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          fail=0
          [ -z "$ADJUST_APP_TOKEN" ] && { echo "::error::Missing secret ADJUST_APP_TOKEN."; fail=1; }
          if [ -z "$OFFER_BASE_URL" ]; then
            echo "::error::Missing secret OFFER_BASE_URL."; fail=1
          else
            case "$OFFER_BASE_URL" in
              http://*|https://*) ;;
              *) echo "::error::OFFER_BASE_URL must start with http:// or https:// or the install goes White forever."; fail=1 ;;
            esac
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing secret GOOGLE_SERVICES_JSON - the release would ship without push."
            fail=1
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null | grep -q '"project_number"'; then
            echo "::error::GOOGLE_SERVICES_JSON does not decode: it must be base64 of google-services.json."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            echo "::error::To ship a deliberately White-only build, delete this step."
            exit 1
          fi
          echo "Integration secrets present."

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Read by secret() in app/build.gradle.kts, which prefers the environment
          # over local.properties.
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          OFFER_ROUTING: ${{ secrets.OFFER_ROUTING }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: gradle --no-daemon assembleRelease bundleRelease

      # Hard gate: a debug certificate or a failed verification stops the run.
      - name: Verify APK signature is not a debug key
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "Verifying $APK"
          apksigner verify --print-certs --verbose "$APK" > certs.txt
          # Never echo secrets; only the certificate summary is printed.
          cat certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Release APK is signed with the Android debug certificate."
            exit 1
          fi
          if ! apksigner verify "$APK"; then
            echo "::error::apksigner verification failed."
            exit 1
          fi
          echo "Signature OK."

      - name: Check the AAB exists
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB was produced."
            exit 1
          fi
          echo "AAB: $AAB"

      - name: Upload APK (for device testing only)
        uses: actions/upload-artifact@v4
        with:
          name: oro-club-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB (the Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oro-club-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" certs.txt
